name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: crm_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: cd server && npm ci

      - name: Apply Supabase schema
        env:
          PGPASSWORD: test
        run: |
          psql -h localhost -U test -d crm_test -c "CREATE SCHEMA IF NOT EXISTS auth; CREATE TABLE IF NOT EXISTS auth.users (id uuid primary key default gen_random_uuid(), email text);"
          psql -h localhost -U test -d crm_test -f supabase/migrations/00001_schema.sql

      - name: Run tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/crm_test?sslmode=disable
          SUPABASE_JWT_SECRET: test-secret-for-ci-minimum-32-chars-x
          NODE_ENV: test
        run: cd server && node tests/api.test.js

  # Railway detecta los pushes a main automáticamente via webhook.
  # No se necesita un step de deploy aquí — Railway lee server/railway.json.
  # Para configurar: Railway Dashboard → Project → Settings → Source → Connect GitHub
