app = "crm-inmobiliario"
primary_region = "mad"

[build]

[http_service]
  internal_port = 3002
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[env]
  PORT = "3002"
  VITE_API_URL = "/api"
  APP_URL = "https://crm-inmobiliario.fly.dev"
  NODE_ENV = "production"
